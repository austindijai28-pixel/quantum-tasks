<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Tasks — 3D Cloud Dashboard</title>
    <meta name="description"
        content="High-performance 3D Cloud Task Manager with real-time AWS synchronization and WebGL visual effects.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 3D Three.js WebGL Interactive Background -->
    <canvas id="webgl-bg-canvas"></canvas>

    <!-- Ambient Glowing Nebulas -->
    <div class="ambient-lighting">
        <div class="ambient-blob blob-1"></div>
        <div class="ambient-blob blob-2"></div>
        <div class="ambient-blob blob-3"></div>
    </div>

    <!-- Main 3D Application Container -->
    <main class="app-container">

        <!-- 1. Floating 3D Top HUD Navbar -->
        <header class="top-hud" id="topHud">
            <div class="brand-section">
                <div class="brand-logo-3d">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>Quantum Tasks</h1>
                    <p>CLOUD WORKSPACE // v3.0</p>
                </div>
            </div>

            <div class="hud-controls">
                <div class="status-badge-cloud" title="AWS API Gateway & Cognito Active">
                    <span class="live-pulse-dot"></span>
                    <span id="cloudStatusText">AWS EU-NORTH-1</span>
                </div>

                <div class="digital-clock" id="digitalClock">--:--:--</div>



                <button id="logoutBtn" class="hud-btn hud-btn-logout" title="End session and return to login">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </header>

        <!-- 2. 3D Analytics KPI Metric Cards -->
        <section class="kpi-grid" aria-label="Task Analytics Overview">
            <!-- Card 1: Total Tasks -->
            <div class="kpi-card" data-kpi="total" id="kpiTotalCard">
                <div class="kpi-header">
                    <span class="kpi-title">Total Tasks</span>
                    <div class="kpi-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                    </div>
                </div>
                <div class="kpi-value" id="kpiTotal">0</div>
                <div class="kpi-footer">
                    <span>Synchronized in DynamoDB</span>
                </div>
            </div>

            <!-- Card 2: Completed -->
            <div class="kpi-card" data-kpi="completed" id="kpiCompletedCard">
                <div class="kpi-header">
                    <span class="kpi-title">Completed</span>
                    <div class="kpi-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                </div>
                <div class="kpi-value" id="kpiCompleted">0</div>
                <div class="kpi-footer">
                    <span id="kpiDonePercent">0% of total</span>
                </div>
            </div>

            <!-- Card 3: Pending -->
            <div class="kpi-card" data-kpi="pending" id="kpiPendingCard">
                <div class="kpi-header">
                    <span class="kpi-title">Pending</span>
                    <div class="kpi-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                </div>
                <div class="kpi-value" id="kpiPending">0</div>
                <div class="kpi-footer">
                    <span>Active backlog</span>
                </div>
            </div>

            <!-- Card 4: Completion Rate -->
            <div class="kpi-card" data-kpi="rate" id="kpiRateCard">
                <div class="kpi-header">
                    <span class="kpi-title">Velocity</span>
                    <div class="kpi-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                        </svg>
                    </div>
                </div>
                <div class="kpi-value" id="kpiRate">0%</div>
                <div class="kpi-progress-track">
                    <div class="kpi-progress-fill" id="kpiProgressBar"></div>
                </div>
            </div>
        </section>

        <!-- 3. Task Action & Filter Panel -->
        <section class="task-action-panel" aria-label="Task Management Controls">
            <div class="input-glow-wrapper">
                <div class="input-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                </div>
                <input type="text" id="task" placeholder="Create a new high-priority task..." autocomplete="off">
                <span class="input-shortcut-hint">ENTER ↵</span>
                <button id="addBtn" class="btn-primary-3d">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Add Task</span>
                </button>
                <button id="refreshBtn" class="btn-icon-3d" title="Sync with Cloud API"
                    aria-label="Sync with Cloud API">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                </button>
            </div>

            <!-- Toolbar: Filter Pills & Search Input -->
            <div class="toolbar-row">
                <div class="filter-pills" role="tablist" aria-label="Filter tasks by status">
                    <button class="filter-pill active" id="filterAll" data-filter="all" role="tab" aria-selected="true">
                        All <span class="filter-count" id="countAll">0</span>
                    </button>
                    <button class="filter-pill" id="filterPending" data-filter="pending" role="tab"
                        aria-selected="false">
                        Pending <span class="filter-count" id="countPending">0</span>
                    </button>
                    <button class="filter-pill" id="filterDone" data-filter="done" role="tab" aria-selected="false">
                        Completed <span class="filter-count" id="countDone">0</span>
                    </button>
                </div>

                <div class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="color: var(--text-dim);">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search tasks..." autocomplete="off">
                </div>
            </div>

            <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
        </section>

        <!-- 4. 3D Task List Section -->
        <section aria-label="Tasks List">
            <ul id="taskList" class="task-list"></ul>
        </section>

    </main>

    <!-- Floating Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Application JavaScript -->
    <script src="app.js"></script>

</body>

</html>
