name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t quantum-tasks .

      - name: Run Docker Container
        run: docker run -d -p 5500:5500 --name my-quantum-tasks quantum-tasks
